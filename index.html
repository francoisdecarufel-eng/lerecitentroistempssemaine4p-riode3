            "un froissement de feuilles", "un cadenas de métal rouillé", "un verrou coincé"
          ]

          key: 'fin',
          title: '3. La Fin',

          ]

          [currentStep.key]: value

        const currentText = storyPlan[currentStep.key] || "";
        let textToAppend = word;

        // Auto-majuscule si début de texte ou après un point
        const trimmed = currentText.trim();
        const needsCapitalization = trimmed.length === 0 || /[.!?]\s*$/.test(trimmed);

        if (needsCapitalization) {
          textToAppend = textToAppend.charAt(0).toUpperCase() + textToAppend.slice(1);
        }

        const newText = trimmed ? `${trimmed} ${textToAppend}` : textToAppend;
        handleTextChange(newText);
        showToast(`Idée ajoutée !`);

                </div>
              </div>

              {/* Navigation Controls */}
              <div className="flex flex-col sm:flex-row justify-between items-center gap-4 pt-6 border-t border-slate-100">
                <button
                  onClick={() => setActiveStepIndex(prev => Math.max(0, prev - 1))}
                  disabled={activeStepIndex === 0}
                  className={`w-full sm:w-auto px-6 py-3 rounded-2xl font-bold text-base transition-all ${
                    activeStepIndex === 0
                      ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                      : 'bg-slate-200 text-slate-700 hover:bg-slate-300'
                  }`}
                >
                  ← Étape précédente
                </button>

                <button
                  onClick={() => setActiveStepIndex(prev => Math.min(steps.length - 1, prev + 1))}
                  disabled={activeStepIndex === steps.length - 1}
                  className={`w-full sm:w-auto px-8 py-3 rounded-2xl font-bold text-base transition-all bg-indigo-600 hover:bg-indigo-700 text-white shadow-md ${
                    activeStepIndex === steps.length - 1 ? 'hidden' : 'block'
                  }`}
                >
                  Étape suivante →
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function VocabulaireTab({ showToast }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [randomIdea, setRandomIdea] = useState(null);

      const copyWord = (word) => {
        const tempTextArea = document.createElement("textarea");
        tempTextArea.value = word;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        try {
          document.execCommand("copy");
          showToast(`Copié : "${word}"`);
        } catch (err) {
          showToast(`Sélectionné : ${word}`);
        }
        document.body.removeChild(tempTextArea);
      };

      const generateRandomIdea = () => {
        const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const lieu = getRandom(VOCABULARY_DATA.lieux.subcategories[1].words);
        const pers = getRandom(VOCABULARY_DATA.personnages.subcategories[0].words);
        const moment = getRandom(VOCABULARY_DATA.moments.subcategories[0].words);
        const pb = getRandom(VOCABULARY_DATA.declencheurs.subcategories[1].words);

        setRandomIdea({ lieu, pers, moment, pb });
      };

      return (
        <div className="space-y-10 animate-fadeIn">
          
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 rounded-3xl p-8 sm:p-10 text-white shadow-xl space-y-6">
            <span className="bg-white/20 text-white font-extrabold text-xs uppercase px-4 py-1.5 rounded-full">
              💡 Boîte à Outils du Rédacteur
            </span>
            <h2 className="text-3xl sm:text-4xl lg:text-5xl font-extrabold font-heading">
              Banque de Vocabulaire d'Automne
            </h2>
            <p className="text-purple-100 text-lg max-w-3xl leading-relaxed">
              Utilise ces mots et expressions riches pour donner de la couleur et des détails à ton récit en trois temps.
            </p>

            {/* Search Bar */}
            <div className="flex flex-col sm:flex-row gap-4 pt-2">
              <input
                type="text"
                placeholder="🔍 Rechercher un mot ou une expression (ex: cabane, vent, clé)..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="flex-1 px-5 py-4 rounded-2xl text-slate-900 text-base font-medium focus:ring-4 focus:ring-yellow-300 outline-none shadow-lg"
              />

              <select
                value={selectedCategory}
                onChange={(e) => setSelectedCategory(e.target.value)}
                className="px-5 py-4 rounded-2xl text-slate-900 text-base font-extrabold bg-white outline-none shadow-lg"
              >
                <option value="all">📁 Toutes les catégories</option>
                <option value="lieux">🏡 Les lieux</option>
                <option value="personnages">🎒 Les personnages</option>
                <option value="moments">🍂 Les moments</option>
                <option value="declencheurs">⚡ L'élément déclencheur</option>
              </select>
            </div>
          </div>

          {/* Random Idea Generator */}
          <div className="bg-gradient-to-r from-amber-400 to-orange-400 rounded-3xl p-8 text-slate-950 shadow-lg space-y-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h3 className="text-2xl font-extrabold font-heading flex items-center gap-3">
                  <span>🎲</span> Générateur d'idées d'histoire
                </h3>
                <p className="text-base font-medium text-slate-900 mt-1">
                  Besoin d'inspiration? Génère une combinaison magique pour ton récit!
                </p>
              </div>
              <button
                onClick={generateRandomIdea}
                className="px-6 py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-extrabold text-base transition-all shadow-md"
              >
                ✨ Lancer le dé magique
              </button>
            </div>

            {randomIdea && (
              <div className="bg-white/95 p-6 rounded-2xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-sm sm:text-base shadow-md">
                <div className="p-3.5 bg-amber-50 rounded-xl border border-amber-200">
                  <span className="font-extrabold text-amber-950 block">👥 Personnage :</span>
                  <span>{randomIdea.pers}</span>
                </div>
                <div className="p-3.5 bg-amber-50 rounded-xl border border-amber-200">
                  <span className="font-extrabold text-amber-950 block">🏡 Lieu :</span>
                  <span>{randomIdea.lieu}</span>
                </div>
                <div className="p-3.5 bg-amber-50 rounded-xl border border-amber-200">
                  <span className="font-extrabold text-amber-950 block">🍂 Moment :</span>
                  <span>{randomIdea.moment}</span>
                </div>
                <div className="p-3.5 bg-amber-50 rounded-xl border border-amber-200">
                  <span className="font-extrabold text-amber-950 block">⚡ Obstacle :</span>
                  <span>{randomIdea.pb}</span>
                </div>
              </div>
            )}
          </div>

          {/* Vocab Categories */}
          <div className="space-y-10">
            {Object.keys(VOCABULARY_DATA).map((catKey) => {
              if (selectedCategory !== 'all' && selectedCategory !== catKey) return null;

              const category = VOCABULARY_DATA[catKey];

              return (
                <div key={catKey} className="bg-white rounded-3xl p-8 shadow-md border border-slate-200 space-y-6">
                  <h3 className="text-2xl sm:text-3xl font-extrabold font-heading text-slate-900 pb-3 border-b border-slate-100">
                    {category.title}
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    {category.subcategories.map((subCat, sIdx) => {
                      const filteredWords = subCat.words.filter(w =>
                        w.toLowerCase().includes(searchTerm.toLowerCase())
                      );

                      if (searchTerm && filteredWords.length === 0) return null;

                      return (
                        <div key={sIdx} className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
                          <h4 className="font-extrabold text-base text-slate-800 font-heading uppercase tracking-wide">
                            🔹 {subCat.subtitle}
                          </h4>

                          <div className="flex flex-wrap gap-2.5">
                            {filteredWords.map((word, wIdx) => (
                              <button
                                key={wIdx}
                                onClick={() => copyWord(word)}
                                className="bg-white hover:bg-purple-600 hover:text-white text-slate-800 text-sm sm:text-base font-bold px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm transition-all"
                                title="Cliquer pour copier"
                              >
                                <span>{word}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function QuizTab({ showToast }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showFeedback, setShowFeedback] = useState(false);
      const [score, setScore] = useState(0);
      const [showHint, setShowHint] = useState(false);
      const [quizFinished, setQuizFinished] = useState(false);

      const currentQ = QUIZ_QUESTIONS[currentQIndex];

      const handleSelectOption = (index) => {
        if (showFeedback) return;
        setSelectedOption(index);
      };

      const handleValidate = () => {
        if (selectedOption === null) return;
        setShowFeedback(true);
        if (selectedOption === currentQ.correctIndex) {
          setScore(prev => prev + 1);
        }
      };

      const handleNextQuestion = () => {
        setSelectedOption(null);
        setShowFeedback(false);
        setShowHint(false);

        if (currentQIndex < QUIZ_QUESTIONS.length - 1) {
          setCurrentQIndex(prev => prev + 1);
        } else {
          setQuizFinished(true);
          if (typeof confetti === 'function') confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } });
        }
      };

      const handleRestartQuiz = () => {
        setCurrentQIndex(0);
        setSelectedOption(null);
        setShowFeedback(false);
        setShowHint(false);
        setScore(0);
        setQuizFinished(false);
      };

      return (
        <div className="space-y-10 animate-fadeIn max-w-5xl mx-auto w-full">
          
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-3xl p-8 sm:p-10 text-white shadow-xl flex flex-col sm:flex-row justify-between items-center gap-6">
            <div>
              <span className="bg-white/20 text-white font-extrabold text-xs uppercase px-4 py-1.5 rounded-full">
                🎯 Validation des connaissances
              </span>
              <h2 className="text-3xl sm:text-4xl lg:text-5xl font-extrabold font-heading mt-3">
                Quiz : Le schéma en trois temps
              </h2>
              <p className="text-emerald-100 text-base mt-1">
                Teste ta compréhension du schéma du récit!
              </p>
            </div>

            {!quizFinished && (
              <div className="bg-white/10 px-6 py-4 rounded-3xl border border-white/20 text-center min-w-[150px] shadow-inner">
                <span className="text-xs uppercase font-extrabold block text-emerald-100">Score</span>
                <span className="text-3xl font-extrabold font-heading text-yellow-300">{score} / {QUIZ_QUESTIONS.length}</span>
              </div>
            )}
          </div>

          {!quizFinished ? (
            <div className="bg-white rounded-3xl p-8 sm:p-12 shadow-md border border-slate-200 space-y-8">
              
              {/* Question Header Bar */}
              <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                <span className="font-heading font-extrabold text-base text-emerald-900 bg-emerald-100 px-4 py-1.5 rounded-xl">
                  Question {currentQIndex + 1} sur {QUIZ_QUESTIONS.length}
                </span>

                <button
                  onClick={() => setShowHint(!showHint)}
                  className="text-sm font-extrabold text-amber-800 bg-amber-100 hover:bg-amber-200 px-4 py-2 rounded-2xl transition-all flex items-center space-x-2"
                >
                  <span>🟡</span>
                  <span>{showHint ? "Masquer l'indice" : "Besoin d'un indice?"}</span>
                </button>
              </div>

              {/* Hint */}
              {showHint && (
                <div className="bg-amber-50 border-l-8 border-amber-400 p-5 rounded-2xl text-amber-950 text-base font-medium animate-fadeIn">
                  💡 <strong>Indice :</strong> {currentQ.hint}
                </div>
              )}

              {/* Question Label */}
              <h3 className="text-2xl sm:text-3xl font-extrabold font-heading text-slate-900 leading-snug">
                {currentQ.question}
              </h3>

              {/* Options Grid */}
              <div className="space-y-4">
                {currentQ.options.map((opt, idx) => {
                  let btnStyle = "bg-slate-50 border-2 border-slate-200 text-slate-800 hover:bg-slate-100";

                  if (selectedOption === idx) {
                    btnStyle = "bg-indigo-50 border-4 border-indigo-600 text-indigo-950 font-bold shadow-md";
                  }

                  if (showFeedback) {
                    if (idx === currentQ.correctIndex) {
                      btnStyle = "bg-emerald-100 border-4 border-emerald-600 text-emerald-950 font-extrabold shadow-md";
                    } else if (selectedOption === idx) {
                      btnStyle = "bg-rose-100 border-4 border-rose-500 text-rose-950 font-bold";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => handleSelectOption(idx)}
                      disabled={showFeedback}
                      className={`w-full text-left p-6 rounded-2xl text-lg sm:text-xl transition-all flex items-center justify-between ${btnStyle}`}
                    >
                      <span className="font-medium leading-relaxed">{opt}</span>
                      {showFeedback && idx === currentQ.correctIndex && <span className="text-emerald-700 font-extrabold text-xl">🟢 Correct</span>}
                      {showFeedback && selectedOption === idx && idx !== currentQ.correctIndex && <span className="text-rose-700 font-extrabold text-xl">🔴 Incorrect</span>}
                    </button>
                  );
                })}
              </div>

              {/* Feedback Explanation */}
              {showFeedback && (
                <div className={`p-6 rounded-3xl text-lg font-medium space-y-2 animate-fadeIn ${
                  selectedOption === currentQ.correctIndex
                    ? 'bg-emerald-50 border border-emerald-300 text-emerald-950'
                    : 'bg-rose-50 border border-rose-300 text-rose-950'
                }`}>
                  <p className="font-extrabold font-heading text-xl">
                    {selectedOption === currentQ.correctIndex ? "🎉 Bravo, c'est exact!" : "❌ Oups, pas tout à fait..."}
                  </p>
                  <p className="leading-relaxed">{currentQ.explanation}</p>
                </div>
              )}

              {/* Action Buttons */}
              <div className="flex justify-end pt-4 border-t border-slate-100">
                {!showFeedback ? (
                  <button
                    onClick={handleValidate}
                    disabled={selectedOption === null}
                    className={`px-10 py-4 rounded-2xl font-heading font-extrabold text-xl transition-all ${
                      selectedOption !== null
                        ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-xl cursor-pointer scale-105'
                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }`}
                  >
                    Vérifier ma réponse
                  </button>
                ) : (
                  <button
                    onClick={handleNextQuestion}
                    className="px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-heading font-extrabold text-xl transition-all shadow-xl scale-105"
                  >
                    {currentQIndex < QUIZ_QUESTIONS.length - 1 ? "Question suivante →" : "Voir mon résultat →"}
                  </button>
                )}
              </div>
            </div>
          ) : (
            /* Quiz Completed Screen */
            <div className="bg-white rounded-3xl p-10 sm:p-16 text-center shadow-2xl border border-slate-200 space-y-8">
              <span className="text-7xl sm:text-8xl block">🏆</span>
              <h3 className="text-4xl sm:text-5xl font-extrabold font-heading text-slate-900">
                Félicitations!
              </h3>
              <p className="text-slate-700 text-xl max-w-xl mx-auto">
                Tu as terminé le quiz sur le schéma du récit en trois temps.
              </p>

              <div className="inline-block bg-slate-900 text-white p-8 rounded-3xl space-y-2 shadow-xl">
                <span className="text-sm uppercase tracking-wider font-extrabold text-slate-400 block">Ton Score Final</span>
                <span className="text-5xl sm:text-6xl font-extrabold font-heading text-yellow-400">
                  {score} / {QUIZ_QUESTIONS.length}
                </span>
              </div>

              <div className="pt-6">
                <button
                  onClick={handleRestartQuiz}
                  className="px-10 py-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-heading font-extrabold text-xl transition-all shadow-xl hover:scale-105"
                >
                  🔄 Recommencer le quiz
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
